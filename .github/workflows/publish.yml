name: Publish to NPM

on:
  push:
    tags:
      - 'v*'

jobs:
  # ─────────────────────────────────────────────────────────────
  # Step 1: Build the cdylib .node addon for each platform
  # Uses `cargo build --lib` to build ONLY the cdylib,
  # NOT the [[bin]] target (which can't link napi symbols).
  # ─────────────────────────────────────────────────────────────
  build-native:
    name: Build .node – ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            node_file: orion-core.win32-x64-msvc.node
            lib_name: orion_core.dll

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            node_file: orion-core.linux-x64-gnu.node
            lib_name: liborion_core.so

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            node_file: orion-core.linux-arm64-gnu.node
            lib_name: liborion_core.so
            use_cross: true

          # macos-13 is the last Intel (x86_64) runner
          - target: x86_64-apple-darwin
            os: macos-13
            node_file: orion-core.darwin-x64.node
            lib_name: liborion_core.dylib
            macos_target: '13.0'

          # macos-latest is now ARM (aarch64)
          - target: aarch64-apple-darwin
            os: macos-latest
            node_file: orion-core.darwin-arm64.node
            lib_name: liborion_core.dylib
            macos_target: '11.0'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # cross is the most reliable ARM Linux cross-compiler
      - name: Install cross (ARM Linux only)
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # Build ONLY the cdylib ([lib] crate-type = ["cdylib"]).
      # --lib ensures the [[bin]] target is never attempted,
      # which would fail because napi symbols are not available
      # in a standalone executable linker context.
      - name: Build cdylib (standard targets)
        if: ${{ !matrix.use_cross }}
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target || '' }}
        run: cargo build --lib --release --target ${{ matrix.target }}

      - name: Build cdylib (ARM Linux via cross)
        if: matrix.use_cross
        run: cross build --lib --release --target ${{ matrix.target }}

      # Rename platform output to the .node filename Node.js expects
      - name: Rename output → .node (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.lib_name }} ${{ matrix.node_file }}
          echo "Built: $(ls -lh ${{ matrix.node_file }})"

      - name: Rename output → .node (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.lib_name }}" "${{ matrix.node_file }}"
          Write-Host "Built: $((Get-Item '${{ matrix.node_file }}').Length / 1MB) MB"

      - name: Upload .node artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: ${{ matrix.node_file }}
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Step 2: Build the UI bundle and publish to npm with all
  #         platform .node binaries bundled in the package.
  # ─────────────────────────────────────────────────────────────
  publish-npm:
    name: Publish to NPM
    needs: build-native
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Build UI bundle
        run: npm run build:ui

      - name: Run tests
        run: npx tsx tests/sticky_and_scroll.test.ts

      - name: Download all native .node artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-artifacts
          merge-multiple: false

      - name: Move .node files to package root
        run: |
          find native-artifacts -name '*.node' -exec cp {} . \;
          echo "=== Bundled native addons ==="
          ls -lh *.node

      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
